[build]
  publish = "."

# Snygga elevlänkar: klassmålet.se/k/ABC123
[[redirects]]
  from = "/k/*"
  to = "/klass.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
